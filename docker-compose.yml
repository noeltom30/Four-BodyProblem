version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: converge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-converge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-converge_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-converge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converge_user -d converge_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - converge-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: converge-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://converge_user:converge_secure_pass_2026@db:5432/converge_db
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      JWT_EXPIRES_IN: 7d
      ADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL:-admin@converge.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - converge-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    container_name: converge-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - converge-network

  # pgAdmin - Database Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: converge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@converge.com
      PGADMIN_DEFAULT_PASSWORD: Admin@123456
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - converge-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  converge-network:
    driver: bridge
